[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-release-notes"
version = "0.1.0"
description = "Automated release notes generator using Git diff context and an OpenAI-compatible LLM API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "LLM Release Notes" }
]
keywords = ["release-notes", "llm", "github", "openai", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "PyGithub>=2.3.0",
  "openai>=1.40.0",
  "PyYAML>=6.0.2",
  "semver>=3.0.2",
]

[project.scripts]
llm-release-notes = "llm_release_notes.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["llm_release_notes"]

